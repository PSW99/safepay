name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  checks: write        # 테스트 결과 리포트 게시용
  pull-requests: write # PR에 코멘트 작성용

jobs:
  # 빌드 + 단위 테스트
  build:
    name: 🔨 Build & Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Grant execute permission
        run: chmod +x gradlew

      - name: 🔨 Build (skip tests)
        run: ./gradlew build -x test --no-daemon

      - name: 🧪 Unit Tests
        run: ./gradlew test --tests "com.safepay.unit.*" --no-daemon

      - name: 📊 Unit Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: backend/build/test-results/test/*.xml
          reporter: java-junit

  # 통합 테스트 (Testcontainers)
  integration-test:
    name: 🐳 Integration Test
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Grant execute permission
        run: chmod +x gradlew

      - name: 🐳 Integration Tests (Testcontainers)
        run: ./gradlew test --tests "com.safepay.integration.*" --no-daemon

      - name: 📊 Integration Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: backend/build/test-results/test/*.xml
          reporter: java-junit

  # 동시성 테스트
  concurrency-test:
    name: ⚡ Concurrency Test
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Grant execute permission
        run: chmod +x gradlew

      - name: ⚡ Concurrency Tests
        run: ./gradlew test --tests "com.safepay.concurrency.*" --no-daemon

      - name: 📊 Concurrency Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Concurrency Test Results
          path: backend/build/test-results/test/*.xml
          reporter: java-junit
