spring:
  application:
    name: safepay
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # MySQL
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000    # 30분
  refresh-token-expiry: 604800000 # 7일

# Distributed Lock
distributed-lock:
  key-prefix: "safepay:lock:account:"
  wait-time: 3      # 락 획득 대기 시간 (초)
  lease-time: 5      # 락 자동 해제 시간 (초)

# Encryption
encryption:
  aes-key: ${AES_SECRET_KEY}
  hmac-key: ${HMAC_SECRET_KEY}

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Logging
logging:
  level:
    com.safepay: INFO
    org.hibernate.SQL: INFO

# Server
server:
  port: 8080
