# MySQL
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/safepay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: safepay
    password: safepay1234
  data:
    redis:
      host: localhost
      port: 6379

# JWT
jwt:
  secret: safepay-jwt-secret-key-for-development-only-change-in-production-please

# Encryption
encryption:
  aes-key: safepay-aes-256-secret!-for-local-dev
  hmac-key: safepay-hmac-256-secret-for-local!!

# Logging
logging:
  level:
    com.safepay: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator + Prometheus 메트릭
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: safepay
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
