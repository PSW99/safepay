spring:
  application:
    name: safepay-test

  # Testcontainers MySQL
  datasource:
    hikari:
      maximum-pool-size: 5

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

# JWT
jwt:
  secret: safepay-test-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000

# Encryption
encryption:
  aes-key: safepay-test-aes-256-key!!-padding

# Distributed Lock
distributed-lock:
  key-prefix: "safepay:lock:account:"
  wait-time: 3
  lease-time: 5

# Logging
logging:
  level:
    com.safepay: WARN
    org.hibernate.SQL: WARN
    org.testcontainers: WARN
